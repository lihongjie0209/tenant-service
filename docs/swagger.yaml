info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Application error codes:
    0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Go API Template
  version: "1.0"
paths:
  /api/v1/groups/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.GroupBody'
              type: object
      security:
      - Bearer: []
      summary: Create a tenant member group
      tags:
      - groups
  /api/v1/groups/list:
