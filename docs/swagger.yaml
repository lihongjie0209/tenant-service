basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      commit:
        type: string
      started_at:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Dependency:
    properties:
      latency:
        type: string
      status:
        type: string
    type: object
  health.Status:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/health.Dependency'
        type: object
      status:
        type: string
    type: object
  httptransport.AcceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  httptransport.ConsumeQuotaRequest:
    properties:
      amount:
        type: integer
      key:
        type: string
      tenant_id:
        type: string
    required:
    - amount
    - key
    - tenant_id
    type: object
  httptransport.CreateGroupRequest:
    properties:
      code:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    required:
    - code
    - name
    - tenant_id
    type: object
  httptransport.CreateInvitationRequest:
    properties:
      email:
        type: string
      expires_in_seconds:
        type: integer
      tenant_id:
        type: string
    required:
    - email
    - expires_in_seconds
    - tenant_id
    type: object
  httptransport.CreateInvitationResponseBody:
    properties:
      invitation:
        $ref: '#/definitions/tenant.Invitation'
      token:
        type: string
    type: object
  httptransport.CreateOrganizationUnitRequest:
    properties:
      code:
        type: string
      name:
        type: string
      parent_id:
        type: string
      tenant_id:
        type: string
    required:
    - code
    - name
    - tenant_id
    type: object
  httptransport.GetOrganizationUnitRequest:
    properties:
      organization_unit_id:
        type: string
    required:
    - organization_unit_id
    type: object
  httptransport.GetQuotaRequest:
    properties:
      key:
        type: string
      tenant_id:
        type: string
    required:
    - key
    - tenant_id
    type: object
  httptransport.GroupMemberRequest:
    properties:
      group_id:
        type: string
      membership_id:
        type: string
    required:
    - group_id
    - membership_id
    type: object
  httptransport.ListGroupsRequest:
    properties:
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListInvitationsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListMembershipsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListOrganizationUnitsRequest:
    properties:
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.ListTenantsRequest:
    properties:
      keyword:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
    type: object
  httptransport.MeResponseBody:
    properties:
      subject:
        type: string
    type: object
  httptransport.RemoveGroupMemberRequest:
    properties:
      group_id:
        type: string
      membership_id:
        type: string
      version:
        type: integer
    required:
    - group_id
    - membership_id
    - version
    type: object
  httptransport.Response:
    properties:
      body: {}
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  httptransport.RevokeInvitationRequest:
    properties:
      invitation_id:
        type: string
      version:
        type: integer
    required:
    - invitation_id
    - version
    type: object
  httptransport.SetQuotaRequest:
    properties:
      key:
        type: string
      limit:
        minimum: 0
        type: integer
      tenant_id:
        type: string
      version:
        minimum: 0
        type: integer
    required:
    - key
    - tenant_id
    type: object
  httptransport.UpdateGroupRequest:
    properties:
      group_id:
        type: string
      name:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - group_id
    - name
    - status
    - version
    type: object
  httptransport.UpdateOrganizationUnitRequest:
    properties:
      name:
        type: string
      organization_unit_id:
        type: string
      parent_id:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - name
    - organization_unit_id
    - status
    - version
    type: object
  tenant.Group:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  tenant.Invitation:
    properties:
      accepted_by_user_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  tenant.InvitationPage:
    properties:
      invitations:
        items:
          $ref: '#/definitions/tenant.Invitation'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  tenant.Membership:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      joined_at:
        type: string
      primary_organization_unit_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: string
      version:
        type: integer
    type: object
  tenant.MembershipPage:
    properties:
      memberships:
        items:
          $ref: '#/definitions/tenant.Membership'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  tenant.OrganizationUnit:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      path:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  tenant.Quota:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      key:
        type: string
      limit:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      used:
        type: integer
      version:
        type: integer
    type: object
info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Application error codes:
    0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Go API Template
  version: "1.0"
paths:
  /api/v1/groups/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.Group'
              type: object
      security:
      - Bearer: []
      summary: Create a tenant member group
      tags:
      - groups
  /api/v1/groups/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListGroupsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: List tenant member groups
      tags:
      - groups
  /api/v1/groups/member-add:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group membership
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GroupMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Add a membership to a group
      tags:
      - groups
  /api/v1/groups/member-remove:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group membership and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RemoveGroupMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Remove a membership from a group using optimistic locking
      tags:
      - groups
  /api/v1/groups/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.Group'
              type: object
      security:
      - Bearer: []
      summary: Update a member group using optimistic locking
      tags:
      - groups
  /api/v1/invitations/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Accept an invitation as the authenticated subject
      tags:
      - invitations
  /api/v1/invitations/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.CreateInvitationResponseBody'
              type: object
      security:
      - Bearer: []
      summary: Create a tenant invitation
      tags:
      - invitations
  /api/v1/invitations/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListInvitationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.InvitationPage'
              type: object
      security:
      - Bearer: []
      summary: List tenant invitations
      tags:
      - invitations
  /api/v1/invitations/revoke:
    post:
      consumes:
      - application/json
      parameters:
      - description: Invitation and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RevokeInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.Invitation'
              type: object
      security:
      - Bearer: []
      summary: Revoke a pending invitation using optimistic locking
      tags:
      - invitations
  /api/v1/me:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MeResponseBody'
              type: object
        "401":
          description: 'Code 20001: unauthorized'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Return the authenticated subject
      tags:
      - authentication
  /api/v1/memberships/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant, filters and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListMembershipsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.MembershipPage'
              type: object
      security:
      - Bearer: []
      summary: List tenant memberships
      tags:
      - memberships
  /api/v1/organization-units/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Organization unit
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateOrganizationUnitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.OrganizationUnit'
              type: object
      security:
      - Bearer: []
      summary: Create an organization unit
      tags:
      - organization-units
  /api/v1/organization-units/get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Organization unit ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GetOrganizationUnitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.OrganizationUnit'
              type: object
      security:
      - Bearer: []
      summary: Get an organization unit
      tags:
      - organization-units
  /api/v1/organization-units/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListOrganizationUnitsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/tenant.OrganizationUnit'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: List a tenant's organization units
      tags:
      - organization-units
  /api/v1/organization-units/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: Organization unit and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateOrganizationUnitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.OrganizationUnit'
              type: object
      security:
      - Bearer: []
      summary: Update or move an organization unit using optimistic locking
      tags:
      - organization-units
  /api/v1/quotas/consume:
    post:
      consumes:
      - application/json
      parameters:
      - description: Quota consumption
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ConsumeQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Atomically consume tenant quota
      tags:
      - quotas
  /api/v1/quotas/get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant quota key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GetQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.Quota'
              type: object
      security:
      - Bearer: []
      summary: Get a tenant quota
      tags:
      - quotas
  /api/v1/quotas/set:
    post:
      consumes:
      - application/json
      parameters:
      - description: Quota and current version; version 0 creates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.SetQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/tenant.Quota'
              type: object
      security:
      - Bearer: []
      summary: Create or update a tenant quota using optimistic locking
      tags:
      - quotas
  /api/v1/tenants/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filters and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListTenantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: List tenants
      tags:
      - tenants
  /api/v1/version:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/buildinfo.Info'
              type: object
      summary: Return build and runtime version information
      tags:
      - operations
  /live:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check process liveness
      tags:
      - operations
  /ready:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
        "503":
          description: 'Code 50003: dependency unavailable'
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check database and Redis readiness
      tags:
      - operations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Enter "Bearer {JWT}".
    in: header
    name: Authorization
    type: apiKey
  PSK:
    description: Enter "PSK {shared-key}" for routes configured with PSK authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
