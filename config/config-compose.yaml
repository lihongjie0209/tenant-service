app:
  env: compose
log:
  level: debug
  file: /app/logs/app.log
swagger:
  enabled: true
database:
  name: platform
  schema: tenant
grpc:
  reflection_enabled: true
cron:
  enabled: true
event_bus:
  enabled: true
  urls: [nats://nats:4222]
auth:
  psk:
    enabled: true
    key: dictionary-provider-dev-psk-0000000000000000
    grpc_methods: [/platform.dictionary.v1.DictionaryProviderService/*]
dictionary_provider:
  enabled: true
  target: tenant-service:9090
outbound:
  grpc:
    dictionary-service:
      target: dictionary-service:9090
      timeout: 5s
      allow_insecure_credentials: true
      auth: {type: psk, token: dictionary-provider-dev-psk-0000000000000000}
      retry:
        max_attempts: 3
        initial_backoff: 100ms
        max_backoff: 1s
        methods: [/platform.dictionary.v1.DictionaryService/*]
      breaker: {enabled: true, failure_threshold: 5, open_timeout: 30s}
      tls: {enabled: false}
