# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: true
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: tenant
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/tenants/update
    - /api/v1/memberships/add
    - /api/v1/memberships/update
    - /api/v1/organization-units/create
    - /api/v1/organization-units/update
    - /api/v1/invitations/accept
    - /api/v1/invitations/revoke
    - /api/v1/groups/create
    - /api/v1/groups/update
    - /api/v1/groups/member-add
    - /api/v1/groups/member-remove
    - /api/v1/quotas/set
    - /api/v1/quotas/consume
  grpc_methods:
    - /platform.tenant.v1.TenantService/UpdateTenant
    - /platform.tenant.v1.TenantService/AddMembership
    - /platform.tenant.v1.TenantService/UpdateMembership
    - /platform.tenant.v1.TenantService/CreateOrganizationUnit
    - /platform.tenant.v1.TenantService/UpdateOrganizationUnit
    - /platform.tenant.v1.TenantService/AcceptInvitation
    - /platform.tenant.v1.TenantService/RevokeInvitation
    - /platform.tenant.v1.TenantService/CreateGroup
    - /platform.tenant.v1.TenantService/UpdateGroup
    - /platform.tenant.v1.TenantService/AddGroupMember
    - /platform.tenant.v1.TenantService/RemoveGroupMember
    - /platform.tenant.v1.TenantService/SetQuota
    - /platform.tenant.v1.TenantService/ConsumeQuota
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
outbound:
  grpc:
    identity:
      target: identity-service.platform.svc.cluster.local:9090
      timeout: 2s
      auth: {type: "", token: ""}
      retry: {max_attempts: 1, initial_backoff: 100ms, max_backoff: 500ms, methods: []}
      breaker: {enabled: true, failure_threshold: 5, open_timeout: 30s}
      tls: {enabled: true, server_name: identity-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
    authorization:
      target: authorization-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: authorization-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
